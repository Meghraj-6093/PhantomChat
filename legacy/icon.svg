<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14" />
      <stop offset="100%" stop-color="#1a1c29" />
    </linearGradient>
    <!-- Ghost Neon Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b6fff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Glowing Ghost Outline -->
  <path d="M256,96 C170,96 140,160 140,240 C140,320 140,380 170,400 C190,410 200,390 220,390 C240,390 246,410 256,410 C266,410 272,390 292,390 C312,390 322,410 342,400 C372,380 372,320 372,240 C372,160 342,96 256,96 Z" 
        fill="url(#neon-grad)" 
        filter="url(#glow)" />
        
  <!-- Ghost Eyes -->
  <circle cx="210" cy="220" r="18" fill="#ffffff" />
  <circle cx="302" cy="220" r="18" fill="#ffffff" />
  
  <!-- Pupils (looking slightly happy/curious) -->
  <circle cx="214" cy="216" r="8" fill="#0b0d14" />
  <circle cx="306" cy="216" r="8" fill="#0b0d14" />
  
  <!-- Cute Ghost Mouth -->
  <path d="M244,260 Q256,276 268,260" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
</svg>
