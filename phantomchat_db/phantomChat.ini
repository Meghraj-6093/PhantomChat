-- ═══════════════════════════════════════════════════════════
--  PHANTOMCHAT v3 — FULL SCHEMA (Production-Ready)
--  Run in: Supabase Dashboard → SQL Editor → New Query → Run
--  Safe to re-run (uses IF NOT EXISTS + DROP POLICY IF EXISTS)
-- ═══════════════════════════════════════════════════════════

create extension if not exists "uuid-ossp";

-- ── USERS ──────────────────────────────────────────────────
create table if not exists public.users (
  id                  uuid primary key references auth.users(id) on delete cascade,
  name                text not null default 'User',
  username            text unique,
  avatar              text default '😀',
  status              text default 'Available',
  bio                 text,
  online              boolean default false,
  last_seen           timestamptz default now(),
  last_seen_hidden    boolean default false,
  email               text,
  username_changed_at bigint default 0,
  two_fa_enabled      boolean default false,
  two_fa_secret       text,
  sound_enabled       boolean default true,
  created_at          timestamptz default now()
);

-- ── FRIENDS ────────────────────────────────────────────────
create table if not exists public.friends (
  id         uuid primary key default uuid_generate_v4(),
  user_id    uuid not null references public.users(id) on delete cascade,
  friend_id  uuid not null references public.users(id) on delete cascade,
  status     text not null check (status in ('pending','accepted','declined')),
  created_at timestamptz default now(),
  unique(user_id, friend_id)
);

-- ── BLOCKS ─────────────────────────────────────────────────
create table if not exists public.blocks (
  id          uuid primary key default uuid_generate_v4(),
  blocker_id  uuid not null references public.users(id) on delete cascade,
  blocked_id  uuid not null references public.users(id) on delete cascade,
  created_at  timestamptz default now(),
  unique(blocker_id, blocked_id)
);

-- ── REPORTS ────────────────────────────────────────────────
create table if not exists public.reports (
  id           uuid primary key default uuid_generate_v4(),
  reporter_id  uuid not null references public.users(id) on delete cascade,
  reported_id  uuid not null references public.users(id) on delete cascade,
  reason       text,
  created_at   timestamptz default now()
);

-- ── STORIES ────────────────────────────────────────────────
create table if not exists public.stories (
  id            uuid primary key default uuid_generate_v4(),
  user_id       uuid not null references public.users(id) on delete cascade,
  text_content  text,
  media_url     text,
  media_type    text default 'text',
  bg_color      text,
  expires_at    timestamptz not null default (now() + interval '24 hours'),
  created_at    timestamptz default now()
);

-- ── STORY VIEWS ───────────────────────────────────────────
create table if not exists public.story_views (
  id         uuid primary key default uuid_generate_v4(),
  story_id   uuid not null references public.stories(id) on delete cascade,
  viewer_id  uuid not null references public.users(id) on delete cascade,
  viewed_at  timestamptz default now(),
  unique(story_id, viewer_id)
);

-- ── CONVERSATIONS ──────────────────────────────────────────
create table if not exists public.conversations (
  id           uuid primary key default uuid_generate_v4(),
  type         text not null check (type in ('dm','room','group')),
  name         text,
  description  text,
  icon         text default '👥',
  wallpaper    text,
  created_by   uuid references public.users(id),
  created_at   timestamptz default now()
);

-- ── CONVERSATION MEMBERS ───────────────────────────────────
create table if not exists public.conversation_members (
  id              uuid primary key default uuid_generate_v4(),
  conversation_id uuid not null references public.conversations(id) on delete cascade,
  user_id         uuid not null references public.users(id) on delete cascade,
  role            text default 'member' check (role in ('admin','member')),
  unread_count    int default 0,
  last_read_at    timestamptz default now(),
  joined_at       timestamptz default now(),
  unique(conversation_id, user_id)
);

-- ── MESSAGES ───────────────────────────────────────────────
create table if not exists public.messages (
  id              uuid primary key default uuid_generate_v4(),
  conversation_id uuid not null references public.conversations(id) on delete cascade,
  sender_id       uuid not null references public.users(id) on delete cascade,
  sender_name     text,
  sender_avatar   text,
  text            text,
  image_url       text,
  file_url        text,
  file_name       text,
  file_size       text,
  voice_url       text,
  voice_duration  int,
  gif_url         text,
  reply_to_id     uuid references public.messages(id),
  reply_to_text   text,
  reply_to_name   text,
  edited          boolean default false,
  deleted         boolean default false,
  disappears_at   timestamptz,
  delivered_to    uuid[] default '{}',
  read_by         uuid[] default '{}',
  created_at      timestamptz default now()
);

-- ── REACTIONS ──────────────────────────────────────────────
create table if not exists public.reactions (
  id         uuid primary key default uuid_generate_v4(),
  message_id uuid not null references public.messages(id) on delete cascade,
  user_id    uuid not null references public.users(id) on delete cascade,
  emoji      text not null,
  unique(message_id, user_id)
);

-- ── PINNED MESSAGES ────────────────────────────────────────
create table if not exists public.pinned_messages (
  id              uuid primary key default uuid_generate_v4(),
  conversation_id uuid not null references public.conversations(id) on delete cascade,
  message_id      uuid not null references public.messages(id) on delete cascade,
  pinned_by       uuid references public.users(id),
  pinned_at       timestamptz default now(),
  unique(conversation_id)
);

-- ── TYPING ─────────────────────────────────────────────────
create table if not exists public.typing (
  conversation_id uuid not null references public.conversations(id) on delete cascade,
  user_id         uuid not null references public.users(id) on delete cascade,
  user_name       text,
  updated_at      timestamptz default now(),
  primary key(conversation_id, user_id)
);

-- ═══════════════════════════════════════════════════════════
--  REPLICA IDENTITY (required for Supabase Realtime)
--  Without this, UPDATE/DELETE events only send the primary key
-- ═══════════════════════════════════════════════════════════
alter table public.messages replica identity full;
alter table public.typing   replica identity full;
alter table public.reactions replica identity full;
alter table public.users    replica identity full;
alter table public.friends  replica identity full;

-- ═══════════════════════════════════════════════════════════
--  ROW LEVEL SECURITY
-- ═══════════════════════════════════════════════════════════
alter table public.users                enable row level security;
alter table public.friends              enable row level security;
alter table public.blocks               enable row level security;
alter table public.reports              enable row level security;
alter table public.stories              enable row level security;
alter table public.story_views          enable row level security;
alter table public.conversations        enable row level security;
alter table public.conversation_members enable row level security;
alter table public.messages             enable row level security;
alter table public.reactions            enable row level security;
alter table public.pinned_messages      enable row level security;
alter table public.typing               enable row level security;

-- Users
drop policy if exists "users_select" on public.users;
drop policy if exists "users_insert" on public.users;
drop policy if exists "users_update" on public.users;
create policy "users_select" on public.users for select using (auth.role()='authenticated');
create policy "users_insert" on public.users for insert with check (auth.uid()=id);
create policy "users_update" on public.users for update using (auth.uid()=id);

-- Friends
drop policy if exists "friends_select" on public.friends;
drop policy if exists "friends_insert" on public.friends;
drop policy if exists "friends_update" on public.friends;
drop policy if exists "friends_delete" on public.friends;
create policy "friends_select" on public.friends for select using (auth.uid()=user_id or auth.uid()=friend_id);
create policy "friends_insert" on public.friends for insert with check (auth.uid()=user_id);
create policy "friends_update" on public.friends for update using (auth.uid()=user_id or auth.uid()=friend_id);
create policy "friends_delete" on public.friends for delete using (auth.uid()=user_id or auth.uid()=friend_id);

-- Blocks
drop policy if exists "blocks_all" on public.blocks;
drop policy if exists "blocks_select" on public.blocks;
drop policy if exists "blocks_insert" on public.blocks;
drop policy if exists "blocks_delete" on public.blocks;
create policy "blocks_select" on public.blocks for select using (auth.uid()=blocker_id);
create policy "blocks_insert" on public.blocks for insert with check (auth.uid()=blocker_id);
create policy "blocks_delete" on public.blocks for delete using (auth.uid()=blocker_id);

-- Reports
drop policy if exists "reports_insert" on public.reports;
drop policy if exists "reports_select" on public.reports;
create policy "reports_insert" on public.reports for insert with check (auth.uid()=reporter_id);
create policy "reports_select" on public.reports for select using (auth.uid()=reporter_id);

-- Stories
drop policy if exists "stories_select" on public.stories;
drop policy if exists "stories_insert" on public.stories;
drop policy if exists "stories_delete" on public.stories;
create policy "stories_select" on public.stories for select using (auth.role()='authenticated');
create policy "stories_insert" on public.stories for insert with check (auth.uid()=user_id);
create policy "stories_delete" on public.stories for delete using (auth.uid()=user_id);

-- Story Views
drop policy if exists "story_views_select" on public.story_views;
drop policy if exists "story_views_insert" on public.story_views;
drop policy if exists "story_views_update" on public.story_views;
create policy "story_views_select" on public.story_views for select using (auth.role()='authenticated');
create policy "story_views_insert" on public.story_views for insert with check (viewer_id=auth.uid());
create policy "story_views_update" on public.story_views for update using (viewer_id=auth.uid());

-- Conversations
drop policy if exists "conv_select" on public.conversations;
drop policy if exists "conv_insert" on public.conversations;
drop policy if exists "conv_update" on public.conversations;
create policy "conv_select" on public.conversations for select using (
  exists(select 1 from public.conversation_members m where m.conversation_id=id and m.user_id=auth.uid())
  or type='room'
);
create policy "conv_insert" on public.conversations for insert with check (auth.role()='authenticated');
create policy "conv_update" on public.conversations for update using (created_by=auth.uid());

-- Members
drop policy if exists "members_select" on public.conversation_members;
drop policy if exists "members_insert" on public.conversation_members;
drop policy if exists "members_update" on public.conversation_members;
drop policy if exists "members_delete" on public.conversation_members;
create policy "members_select" on public.conversation_members for select using (
  user_id=auth.uid() or exists(select 1 from public.conversation_members m2 where m2.conversation_id=conversation_id and m2.user_id=auth.uid())
);
create policy "members_insert" on public.conversation_members for insert with check (auth.role()='authenticated');
create policy "members_update" on public.conversation_members for update using (user_id=auth.uid());
create policy "members_delete" on public.conversation_members for delete using (user_id=auth.uid());

-- Messages
drop policy if exists "msg_select" on public.messages;
drop policy if exists "msg_insert" on public.messages;
drop policy if exists "msg_update" on public.messages;
create policy "msg_select" on public.messages for select using (
  exists(select 1 from public.conversation_members m where m.conversation_id=messages.conversation_id and m.user_id=auth.uid())
  or exists(select 1 from public.conversations c where c.id=messages.conversation_id and c.type='room')
);
create policy "msg_insert" on public.messages for insert with check (sender_id=auth.uid());
create policy "msg_update" on public.messages for update using (sender_id=auth.uid());

-- Reactions
drop policy if exists "react_select" on public.reactions;
drop policy if exists "react_insert" on public.reactions;
drop policy if exists "react_update" on public.reactions;
drop policy if exists "react_delete" on public.reactions;
create policy "react_select" on public.reactions for select using (auth.role()='authenticated');
create policy "react_insert" on public.reactions for insert with check (user_id=auth.uid());
create policy "react_update" on public.reactions for update using (user_id=auth.uid());
create policy "react_delete" on public.reactions for delete using (user_id=auth.uid());

-- Pinned messages
drop policy if exists "pin_select" on public.pinned_messages;
drop policy if exists "pin_insert" on public.pinned_messages;
drop policy if exists "pin_delete" on public.pinned_messages;
create policy "pin_select" on public.pinned_messages for select using (auth.role()='authenticated');
create policy "pin_insert" on public.pinned_messages for insert with check (auth.role()='authenticated');
create policy "pin_delete" on public.pinned_messages for delete using (
  exists(select 1 from public.conversation_members m where m.conversation_id=pinned_messages.conversation_id and m.user_id=auth.uid())
);

-- Typing
drop policy if exists "typing_select" on public.typing;
drop policy if exists "typing_upsert" on public.typing;
drop policy if exists "typing_update" on public.typing;
drop policy if exists "typing_delete" on public.typing;
create policy "typing_select" on public.typing for select using (auth.role()='authenticated');
create policy "typing_upsert" on public.typing for insert with check (user_id=auth.uid());
create policy "typing_update" on public.typing for update using (user_id=auth.uid());
create policy "typing_delete" on public.typing for delete using (user_id=auth.uid());

