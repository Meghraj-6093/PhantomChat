insert into storage.buckets(id,name,public) values('phantom-media','phantom-media',true) on conflict(id) do nothing;
drop policy if exists "storage_read"   on storage.objects;
drop policy if exists "storage_insert" on storage.objects;
drop policy if exists "storage_delete" on storage.objects;
create policy "storage_read"   on storage.objects for select using (bucket_id='phantom-media');
create policy "storage_insert" on storage.objects for insert with check (bucket_id='phantom-media' and auth.role()='authenticated');
create policy "storage_delete" on storage.objects for delete using (bucket_id='phantom-media' and auth.role()='authenticated');

